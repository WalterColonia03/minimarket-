{% extends "identity/base.html" %}

{% block title %}Cerrar sesión · Minimarket{% endblock %}

{% block content %}
<section class="panel empty-state">
  <span class="status status-pending">Sesión de trabajo</span>
  <div class="empty-icon" aria-hidden="true">↪</div>
  <h1>¿Deseas cerrar sesión?</h1>
  <p>Volverás a la pantalla de ingreso y deberás autenticarte para continuar.</p>
  <form method="post" class="form-actions center-actions">
    {% csrf_token %}
    <button class="button button-primary" type="submit">Cerrar sesión</button>
    <a class="button button-secondary" href="{% url 'dashboard' %}">Cancelar</a>
  </form>
</section>
{% endblock %}
